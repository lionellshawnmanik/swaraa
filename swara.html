<!DOCTYPE html>

    <style>
        /* Font paling aneh yang ada di sistem */
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Creepster&family=Paprika&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff0000);
            background-size: 400% 400%;
            animation: gradientBG 2s infinite linear;
            overflow-x: hidden;
            font-family: 'Comic Neue', cursive;
            cursor: url('https://cur.cursors-4u.net/memes/mem-1/mem3.cur'), auto;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Memes Everywhere */
        .meme-gif {
            position: absolute;
            width: 150px;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.8);
            border: 10px dashed #00ff00;
            padding: 30px;
            transform: rotate(-5deg);
            box-shadow: 20px 20px 0px #000;
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 4rem;
            color: #ff007a;
            text-shadow: 5px 5px #fff;
            margin-bottom: 20px;
        }

        .poetry-freaky {
            font-size: 1.2rem;
            color: #000;
            background: yellow;
            padding: 10px;
            margin-bottom: 30px;
            border: 2px solid #000;
        }

        /* The Button - Peak Chaos */
        .scary-btn {
            font-family: 'Bungee', sans-serif;
            font-size: 2rem;
            background: #ff0000;
            color: white;
            padding: 20px 50px;
            border-radius: 50%;
            border: 5px solid white;
            cursor: pointer;
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
        }

        marquee {
            width: 100%;
            background: #000;
            color: #0f0;
            font-size: 2rem;
            position: fixed;
            top: 0;
        }

        .audio-info {
            position: fixed;
            bottom: 0;
            background: white;
            padding: 5px;
            font-size: 0.8rem;
        }
    </style>
</head>
